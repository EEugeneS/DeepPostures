apiVersion: batch/v1
kind: Job
metadata:
  name: moca-wrist-solw-ft-ageval-chapcompat-v1-s42
  labels: {app: deep-postures, dataset: moca-wrist, stage: pooled-age-validation, model: solw-ft, seed: "42", preprocessing: chap-compatible-v1}
spec:
  completionMode: Indexed
  completions: 6
  parallelism: 6
  backoffLimit: 6
  ttlSecondsAfterFinished: 604800
  template:
    metadata:
      labels: {app: deep-postures, dataset: moca-wrist, stage: pooled-age-validation, model: solw-ft, seed: "42", preprocessing: chap-compatible-v1}
    spec:
      restartPolicy: Never
      terminationGracePeriodSeconds: 120
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values: [nautilus-ext-gpu01.fullerton.edu, ry-gpu-15.sdsc.optiputer.net, k8s-chase-ci-03.calit2.optiputer.net, patternlab.calit2.optiputer.net]
      containers:
        - name: evaluator
          image: ghcr.io/eeugenes/deep-postures-rise@sha256:b143797b215b5c87baab307db8b6d3fd721a4cb47e1197be7c7337dc7464730c
          imagePullPolicy: Always
          command: [bash, -lc]
          args:
            - |
              set -euo pipefail
              ages=(1.5to5.9 6to9.9 10to12.9 13to14.9 15to17.9 18to20)
              age="${ages[${JOB_COMPLETION_INDEX}]}"
              exec python /opt/deep-postures/rise/run.py \
                --family chap --mode predict --split validation --metrics-only \
                --data-dir "/niddk-data-central/yuchen_workspace/moca_wrist_outputs/chap_ready/${age}" \
                --checkpoint /niddk-data-central/yuchen_workspace/moca_wrist_outputs/runs/chap_compatible_v1/tuning/solw/lr-1e-4/seed42/best.pt \
                --output-dir "/niddk-data-central/yuchen_workspace/moca_wrist_outputs/runs/chap_compatible_v1/validation/pooled_by_age/solw-ft/seed42/${age}" \
                --batch-size 64 --workers 0 --device cuda
          env:
            - name: JOB_COMPLETION_INDEX
              valueFrom:
                fieldRef:
                  fieldPath: metadata.annotations['batch.kubernetes.io/job-completion-index']
            - {name: HOME, value: /scratch/home}
            - {name: XDG_CACHE_HOME, value: /scratch/cache}
            - {name: TORCH_HOME, value: /scratch/cache/torch}
            - {name: TMPDIR, value: /scratch/tmp}
            - {name: OMP_NUM_THREADS, value: "1"}
            - {name: MKL_NUM_THREADS, value: "1"}
          resources:
            requests: {cpu: "4", memory: 24Gi, ephemeral-storage: 10Gi, nvidia.com/gpu: "1"}
            limits: {cpu: "4", memory: 24Gi, ephemeral-storage: 20Gi, nvidia.com/gpu: "1"}
          volumeMounts:
            - {name: niddk-data-central, mountPath: /niddk-data-central}
            - {name: scratch, mountPath: /scratch}
            - {name: dshm, mountPath: /dev/shm}
      volumes:
        - name: niddk-data-central
          persistentVolumeClaim: {claimName: niddk-data-central}
        - name: scratch
          emptyDir: {sizeLimit: 20Gi}
        - name: dshm
          emptyDir: {medium: Memory, sizeLimit: 2Gi}
