apiVersion: batch/v1
kind: Job
metadata:
  name: moca-wrist-chap-tuning-chapcompat-v1-s42
  labels: {app: deep-postures, dataset: moca-wrist, stage: tuning, seed: "42"}
spec:
  completionMode: Indexed
  completions: 9
  parallelism: 3
  backoffLimit: 9
  ttlSecondsAfterFinished: 604800
  template:
    metadata:
      labels: {app: deep-postures, dataset: moca-wrist, stage: tuning, seed: "42"}
    spec:
      restartPolicy: Never
      terminationGracePeriodSeconds: 120
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values: [nautilus-ext-gpu01.fullerton.edu, ry-gpu-15.sdsc.optiputer.net, k8s-chase-ci-03.calit2.optiputer.net, patternlab.calit2.optiputer.net]
      containers:
        - name: tuner
          image: ghcr.io/eeugenes/deep-postures-rise@sha256:b143797b215b5c87baab307db8b6d3fd721a4cb47e1197be7c7337dc7464730c
          imagePullPolicy: Always
          command: [python, /opt/deep-postures/moca_wrist/run_tuning.py]
          args:
            - --data-root
            - /niddk-data-central/yuchen_workspace/moca_wrist_outputs/chap_ready
            - --output-root
            - /niddk-data-central/yuchen_workspace/moca_wrist_outputs/runs/chap_compatible_v1/tuning
            - --chap1-checkpoint
            - /niddk-data-central/yuchen_workspace/DeepPostures/CHAP2/SUBMIT_RESULT/iWatch_H/CHAP-ZS/checkpoint/checkpoint-submit.pth
            - --solw-checkpoint
            - /niddk-data-central/yuchen_workspace/DeepPostures/CHAP2/SUBMIT_RESULT/SOL_W/CHAP_FT/checkpoint-submit.pth
            - --epochs
            - "20"
            - --batch-size
            - "64"
            - --workers
            - "4"
            - --weight-decay
            - "0.001"
            - --seed
            - "42"
          env:
            - name: JOB_COMPLETION_INDEX
              valueFrom:
                fieldRef:
                  fieldPath: metadata.annotations['batch.kubernetes.io/job-completion-index']
            - {name: HOME, value: /scratch/home}
            - {name: XDG_CACHE_HOME, value: /scratch/cache}
            - {name: TORCH_HOME, value: /scratch/cache/torch}
            - {name: TMPDIR, value: /scratch/tmp}
            - {name: OMP_NUM_THREADS, value: "1"}
            - {name: MKL_NUM_THREADS, value: "1"}
          resources:
            requests: {cpu: "4", memory: 24Gi, ephemeral-storage: 10Gi, nvidia.com/gpu: "1"}
            limits: {cpu: "4", memory: 24Gi, ephemeral-storage: 20Gi, nvidia.com/gpu: "1"}
          volumeMounts:
            - {name: niddk-data-central, mountPath: /niddk-data-central}
            - {name: scratch, mountPath: /scratch}
            - {name: dshm, mountPath: /dev/shm}
      volumes:
        - name: niddk-data-central
          persistentVolumeClaim: {claimName: niddk-data-central}
        - name: scratch
          emptyDir: {sizeLimit: 20Gi}
        - name: dshm
          emptyDir: {medium: Memory, sizeLimit: 2Gi}
